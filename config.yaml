# ─────────────────────────────────────────────────────────────────────────────
# Trading Signal Dashboard — central configuration
# ─────────────────────────────────────────────────────────────────────────────

universe:
  # "sp500" = full S&P 500 (auto-fetched), or supply explicit list under tickers.
  source: sp500
  tickers: []
  benchmark: SPY
  max_symbols: 100        # cap for daily scan to keep runtime sane

data:
  history_period: "2y"
  interval: "1d"
  cache_dir: "data/cache"
  cache_ttl_hours: 12     # treat parquet as stale after this
  use_adjusted: true

indicators:
  rsi: [2, 14]
  ema: [9, 21, 50, 200]
  bollinger: { window: 20, std: 2 }
  atr: 14
  volume_sma: 20
  macd: { fast: 12, slow: 26, signal: 9 }

regime:
  spy_sma: 200            # bull if SPY close > SMA(200)

risk:
  account_size: 10000
  risk_per_trade: 0.01    # 1% of equity
  atr_stop_multiplier: 2.0
  take_profit_r_multiple: 2.0   # TP at 2R by default
  max_open_positions: 10

strategies:
  # Legacy global block — kept for back-compat with the scheduler. The
  # dashboard reads strategy params from the per-mode `modes.<mode>.strategies`
  # blocks below.
  enabled: [minervini, mean_reversion, breakout, bb_breakout]

# ── Trading mode profiles ────────────────────────────────────────────────
# Each profile defines the timeframe, history depth, indicator periods, and
# the *named* strategies (with parameters tuned for that horizon). The
# dashboard renders both modes side by side; cache directories are scoped
# per (interval, period) so swing and day data never overwrite each other.
modes:
  swing:
    label: "📅 Swing Trading"
    description: "Daily bars · holds days to weeks · named systems from Minervini, Connors, Dennis."
    interval: "1d"
    period: "2y"
    max_hold_bars: 60          # ~12 weeks
    indicators:
      rsi: [2, 14]
      ema: [9, 21, 50, 200]
      bollinger: { window: 20, std: 2 }
      atr: 14
      volume_sma: 20
      macd: { fast: 12, slow: 26, signal: 9 }
    strategies:
      enabled: [minervini, mean_reversion, breakout, bb_breakout]
      # 🏆 Minervini SEPA Trend Template (Trade Like a Stock Market Wizard)
      minervini:
        roc_period: 120                # bars for relative-strength proxy
        rs_threshold: 0.10             # RS proxy: 120-bar ROC ≥ 10%
        min_pct_above_52w_low: 0.30    # at least 30% above 52-wk low
        max_pct_below_52w_high: 0.25   # within 25% of 52-wk high
        sma200_uptrend_bars: 22        # SMA200 must be rising for ~1 month
      # 🔄 Larry Connors RSI-2 (Short Term Trading Strategies That Work)
      mean_reversion:
        rsi_period: 2
        rsi_oversold: 5                # canonical Connors threshold
        trend_filter_ema: 200
        require_pullback: true         # require Close < SMA(5)
      # 🐢 Turtle System 1 (Dennis / Eckhardt)
      breakout:
        donchian_window: 20
        volume_multiplier: 1.5
      # 💥 Bollinger Squeeze Breakout (Bollinger 2001) — universal
      bb_breakout:
        squeeze_lookback: 60           # bars for bandwidth median
        squeeze_multiple: 0.85         # bandwidth must be ≤ 85% of median
        trend_filter_ema: 200

  day:
    label: "⚡ Day Trading"
    description: "Hourly bars · holds hours to ~2 days · Crabel + VWAP intraday classics."
    interval: "1h"
    period: "730d"             # yfinance hard limit for hourly data
    max_hold_bars: 24          # ~1 trading day max
    indicators:
      rsi: [2, 14]
      ema: [9, 21, 50, 200]    # in hours now (~8 trading days for EMA200)
      bollinger: { window: 20, std: 2 }
      atr: 14
      volume_sma: 20
      macd: { fast: 12, slow: 26, signal: 9 }
    strategies:
      enabled: [orb, vwap_reversion, inside_bar, pivot_breakout]
      # 🌅 Toby Crabel — Opening Range Breakout
      orb:
        opening_bars: 1                # first hour defines the range
        volume_multiplier: 1.5
      # 📊 Session-anchored VWAP mean reversion (institutional standard)
      vwap_reversion:
        z_threshold: 1.5               # σ deviation from VWAP to trigger
        trend_filter_ema: 50
        min_bars_in_session: 3         # need a few bars before VWAP is meaningful
      # 🪤 Toby Crabel — Inside Bar / NR4 compression breakout
      inside_bar:
        require_nr4: true              # require narrowest range of last 4 bars
      # 🧭 Floor-trader Pivot Point R1/S1 breakout (universal)
      pivot_breakout:
        volume_multiplier: 1.5


backtest:
  initial_cash: 10000
  commission_pct: 0.0005   # 5 bps per side
  slippage_pct: 0.0005

notifications:
  enabled: false
  channels: []             # one or more of: email, telegram
  email:
    smtp_host: ""
    smtp_port: 587
    username: ""
    password: ""
    from_addr: ""
    to_addrs: []
  telegram:
    bot_token: ""
    chat_id: ""

database:
  path: "database/trades.db"

dashboard:
  title: "Trading Signal Dashboard"
  refresh_seconds: 300
