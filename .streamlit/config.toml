# Theme only — server settings (port, headless) are intentionally omitted
# so Streamlit Community Cloud can manage the port itself.
# When running locally on a busy machine, pass `--server.port 8503` to
# `streamlit run bot.py`.

[theme]
base = "dark"
primaryColor = "#58a6ff"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
